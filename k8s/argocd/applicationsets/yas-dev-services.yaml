apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yas-dev-services
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: backoffice-bff
        chartPath: k8s/charts/backoffice-bff
        valuesFile: k8s/environments/dev/backoffice-bff-values.yaml
      - name: backoffice-ui
        chartPath: k8s/charts/backoffice-ui
        valuesFile: k8s/environments/dev/backoffice-ui-values.yaml
      - name: storefront-bff
        chartPath: k8s/charts/storefront-bff
        valuesFile: k8s/environments/dev/storefront-bff-values.yaml
      - name: storefront-ui
        chartPath: k8s/charts/storefront-ui
        valuesFile: k8s/environments/dev/storefront-ui-values.yaml
      - name: swagger-ui
        chartPath: k8s/charts/swagger-ui
        valuesFile: k8s/environments/dev/swagger-ui-values.yaml
      - name: cart
        chartPath: k8s/charts/cart
        valuesFile: k8s/environments/dev/cart-values.yaml
      - name: customer
        chartPath: k8s/charts/customer
        valuesFile: k8s/environments/dev/customer-values.yaml
      - name: inventory
        chartPath: k8s/charts/inventory
        valuesFile: k8s/environments/dev/inventory-values.yaml
      - name: location
        chartPath: k8s/charts/location
        valuesFile: k8s/environments/dev/location-values.yaml
      - name: media
        chartPath: k8s/charts/media
        valuesFile: k8s/environments/dev/media-values.yaml
      - name: order
        chartPath: k8s/charts/order
        valuesFile: k8s/environments/dev/order-values.yaml
      - name: payment
        chartPath: k8s/charts/payment
        valuesFile: k8s/environments/dev/payment-values.yaml
      - name: payment-paypal
        chartPath: k8s/charts/payment-paypal
        valuesFile: k8s/environments/dev/payment-paypal-values.yaml
      - name: product
        chartPath: k8s/charts/product
        valuesFile: k8s/environments/dev/product-values.yaml
      - name: promotion
        chartPath: k8s/charts/promotion
        valuesFile: k8s/environments/dev/promotion-values.yaml
      - name: rating
        chartPath: k8s/charts/rating
        valuesFile: k8s/environments/dev/rating-values.yaml
      - name: search
        chartPath: k8s/charts/search
        valuesFile: k8s/environments/dev/search-values.yaml
      - name: tax
        chartPath: k8s/charts/tax
        valuesFile: k8s/environments/dev/tax-values.yaml
      - name: recommendation
        chartPath: k8s/charts/recommendation
        valuesFile: k8s/environments/dev/recommendation-values.yaml
      - name: webhook
        chartPath: k8s/charts/webhook
        valuesFile: k8s/environments/dev/webhook-values.yaml
      - name: sampledata
        chartPath: k8s/charts/sampledata
        valuesFile: k8s/environments/dev/sampledata-values.yaml
  template:
    metadata:
      name: yas-dev-{{name}}
      labels:
        app.kubernetes.io/part-of: yas
        app.kubernetes.io/environment: dev
        app.kubernetes.io/name: '{{name}}'
    spec:
      project: yas
      sources:
      - repoURL: https://github.com/TrNhDuong/yas_devops.git
        targetRevision: main
        path: '{{chartPath}}'
        helm:
          releaseName: '{{name}}'
          valueFiles:
          - $values/{{valuesFile}}
      - repoURL: https://github.com/TrNhDuong/yas_devops.git
        targetRevision: main
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: yas-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
