apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yas-staging-services
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: backoffice-bff
        chartPath: k8s/charts/backoffice-bff
        valuesFile: k8s/environments/staging/backoffice-bff-values.yaml
      - name: backoffice-ui
        chartPath: k8s/charts/backoffice-ui
        valuesFile: k8s/environments/staging/backoffice-ui-values.yaml
      - name: storefront-bff
        chartPath: k8s/charts/storefront-bff
        valuesFile: k8s/environments/staging/storefront-bff-values.yaml
      - name: storefront-ui
        chartPath: k8s/charts/storefront-ui
        valuesFile: k8s/environments/staging/storefront-ui-values.yaml
      - name: swagger-ui
        chartPath: k8s/charts/swagger-ui
        valuesFile: k8s/environments/staging/swagger-ui-values.yaml
      - name: cart
        chartPath: k8s/charts/cart
        valuesFile: k8s/environments/staging/cart-values.yaml
      - name: customer
        chartPath: k8s/charts/customer
        valuesFile: k8s/environments/staging/customer-values.yaml
      - name: inventory
        chartPath: k8s/charts/inventory
        valuesFile: k8s/environments/staging/inventory-values.yaml
      - name: location
        chartPath: k8s/charts/location
        valuesFile: k8s/environments/staging/location-values.yaml
      - name: media
        chartPath: k8s/charts/media
        valuesFile: k8s/environments/staging/media-values.yaml
      - name: order
        chartPath: k8s/charts/order
        valuesFile: k8s/environments/staging/order-values.yaml
      - name: payment
        chartPath: k8s/charts/payment
        valuesFile: k8s/environments/staging/payment-values.yaml
      - name: payment-paypal
        chartPath: k8s/charts/payment-paypal
        valuesFile: k8s/environments/staging/payment-paypal-values.yaml
      - name: product
        chartPath: k8s/charts/product
        valuesFile: k8s/environments/staging/product-values.yaml
      - name: promotion
        chartPath: k8s/charts/promotion
        valuesFile: k8s/environments/staging/promotion-values.yaml
      - name: rating
        chartPath: k8s/charts/rating
        valuesFile: k8s/environments/staging/rating-values.yaml
      - name: search
        chartPath: k8s/charts/search
        valuesFile: k8s/environments/staging/search-values.yaml
      - name: tax
        chartPath: k8s/charts/tax
        valuesFile: k8s/environments/staging/tax-values.yaml
      - name: recommendation
        chartPath: k8s/charts/recommendation
        valuesFile: k8s/environments/staging/recommendation-values.yaml
      - name: webhook
        chartPath: k8s/charts/webhook
        valuesFile: k8s/environments/staging/webhook-values.yaml
      - name: sampledata
        chartPath: k8s/charts/sampledata
        valuesFile: k8s/environments/staging/sampledata-values.yaml
  template:
    metadata:
      name: yas-staging-{{name}}
      labels:
        app.kubernetes.io/part-of: yas
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: '{{name}}'
    spec:
      project: yas
      sources:
      - repoURL: https://github.com/TrNhDuong/yas_devops.git
        targetRevision: main
        path: '{{chartPath}}'
        helm:
          releaseName: '{{name}}'
          valueFiles:
          - $values/{{valuesFile}}
      - repoURL: https://github.com/TrNhDuong/yas_devops.git
        targetRevision: main
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: yas-staging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
