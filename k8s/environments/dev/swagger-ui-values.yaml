        { url: 'http://api-dev.yas.local.com/order/v3/api-docs', name: 'Order'},
        { url: 'http://api-dev.yas.local.com/payment/v3/api-docs', name: 'Payment'},
        { url: 'http://api-dev.yas.local.com/location/v3/api-docs', name: 'Location'},
        { url: 'http://api-dev.yas.local.com/inventory/v3/api-docs', name: 'Inventory'},
